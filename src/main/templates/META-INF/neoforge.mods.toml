# This is an example neoforge.mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional (#optional).
# The overall format is standard TOML format, v0.5.0.

modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory

# The license for your mod.
license="${mod_license}"

# A URL to refer people to when problems occur with this mod
#issueTrackerURL="https://github.com/yourname/cbc-firecontrol/issues" #optional

# A list of mods - how many allowed here is determined by the individual mod loader
[[mods]] #mandatory

# The modid of the mod
modId="${mod_id}" #mandatory

# The version number of the mod
version="${mod_version}" #mandatory

# A display name for the mod
displayName="${mod_name}" #mandatory

# A URL to query for updates for this mod. See the JSON update specification https://docs.neoforged.net/docs/misc/updatechecker/
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional

# A URL for the "homepage" for this mod, displayed in the mod UI
#displayURL="https://github.com/yourname/cbc-firecontrol" #optional

# A file name (in the root of the mod JAR) containing a logo for display
#logoFile="cbc_firecontrol.png" #optional

# The authors of the mod, displayed in the mod UI (optional)
#authors=""

# The description text for the mod (multi line!) (#mandatory)
description='''
A Create Big Cannons addon for fire control systems.
'''

# Our one mixin config. NeoForge reads it straight from here (no Gradle mixin plugin needed); the config's
# plugin skips the Sable compat mixin unless Sable is actually installed, the same way CBC gates its own.
[[mixins]]
config = "${mod_id}.mixins.json"

# A dependency - use the . to indicate dependency for a specific modid. Dependencies are optional.
[[dependencies.${mod_id}]] #optional
    # the modid of the dependency
    modId="neoforge" #mandatory
    # The type of the dependency. Can be one of "required", "optional", "incompatible" or "discouraged".
    type="required" #mandatory
    # The version range of the dependency
    versionRange="[${neo_version},)" #mandatory
    # An ordering relationship for the dependency.
    ordering="NONE"
    # Side this dependency is applied on - BOTH, CLIENT, or SERVER
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="${create_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="createbigcannons"
    type="required"
    versionRange="${cbc_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ritchiesprojectilelib"
    type="required"
    versionRange="${rpl_version_range}"
    ordering="NONE"
    side="BOTH"

# Sable is optional, exactly as it is for CBC: we never compile against it. Declaring it lets the loader
# resolve it as a soft dependency (so load ordering and the /mixed + mod list report it) and matches CBC's own
# metadata, which is what our compat mixin relies on - CBC registers the sub-level coordinate/force handling,
# and we only extend that handling to our mount.
[[dependencies.${mod_id}]]
    modId="sable"
    type="optional"
    versionRange="${sable_version_range}"
    ordering="NONE"
    side="BOTH"
