# can set running=true after inlining CBC's assembly logic. CBC gates its tick()
# rotation updates on this flag; without it our mount would assemble but never
# physically rotate the mounted cannon.
#
# Format follows NeoForge's AT spec (docs.neoforged.net/docs/advanced/accesstransformers):
# <access-modifier> <fully-qualified-class-name> <field-name>
# (field descriptors are optional in NeoForge 21.x for fields)
protected rbasamoyai.createbigcannons.cannon_control.cannon_mount.CannonMountBlockEntity running
